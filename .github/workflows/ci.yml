name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Pull-request gate 8 of docs/11_TESTING_AND_QUALITY.md. The audit blocks on
      # a high or critical advisory as defined in docs/SUPPLY_CHAIN_POLICY.md
      # section 6.2; the license gate enforces section 5. Both run on every
      # platform so a platform-specific optional dependency cannot slip through.
      - name: Dependency vulnerability scan
        run: pnpm run deps:audit

      - name: Dependency license scan
        run: pnpm run deps:licenses
