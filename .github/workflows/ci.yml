name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Every Node major marked supported in docs/SUPPORT_POLICY.md section 3.1.
        # Commitment C2 of docs/adr/ADR-006-supported-runtime-and-typescript-policy.md
        # makes this list a function of that table, and
        # tests/support-policy.test.ts fails if the two disagree. The floor is
        # pinned to its exact minimum so the declared engines.node range is
        # actually exercised rather than merely asserted.
        node: ["22.12.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Pull-request gate 8 of docs/11_TESTING_AND_QUALITY.md. The audit blocks on
      # a high or critical advisory as defined in docs/SUPPLY_CHAIN_POLICY.md
      # section 6.2; the license gate enforces section 5. Both run on every
      # platform so a platform-specific optional dependency cannot slip through.
      - name: Dependency vulnerability scan
        run: pnpm run deps:audit

      - name: Dependency license scan
        run: pnpm run deps:licenses

  # Commitment C7 of docs/adr/ADR-006-supported-runtime-and-typescript-policy.md:
  # pre-release TypeScript is tested for advance warning only. This job is
  # deliberately not a required check and continue-on-error keeps a compiler
  # regression upstream from blocking a merge here.
  typescript-canary:
    name: TypeScript canary (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pre-release TypeScript
        run: pnpm add -w -D typescript@next --no-frozen-lockfile

      - name: Type check against pre-release TypeScript
        run: pnpm run typecheck
